[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "brickbuilder"
version = "0.1.0"
description = "Reproducible workflows for designing, checking and sourcing brick models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
render = ["numpy==2.2.6", "pillow==11.3.0", "numba==0.61.2"]

[project.scripts]
brickbuilder = "brickbuilder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brickbuilder"]

[dependency-groups]
dev = [
    "ty>=0.0.84",
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
markers = [
    "render: requires the optional rendering dependencies",
    "e2e: exercises an installed wheel through subprocesses",
]
