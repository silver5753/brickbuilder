name: Core and baseline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Type check source and tests
        run: uv run --locked --python ${{ matrix.python-version }} ty check src tests --error-on-warning
      - run: uv run --locked --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
      - run: uv run --locked --python ${{ matrix.python-version }} python -c "import brickbuilder; print(brickbuilder.__version__)"
      - run: uv build --python ${{ matrix.python-version }}
