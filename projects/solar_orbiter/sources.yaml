interpretation:
  - HIS flight exterior has a narrow slit; do not model it as a round lens.
  - Cutaways locate instruments but do not establish normal exterior appearance.
  - Ground-support hardware is not flight hardware.
  - Generated concept dimensions are not engineering measurements.
  - Offset boom geometry is a visually informed brick approximation.
redistribution: Reference assets are linked, not included.
